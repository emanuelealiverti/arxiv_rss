# Free-text description of your research interests (sent directly to the LLM).
context: >
  I am a professor of statistics with research focused on Bayesian methodology
  and computation for complex data. My primary interests are:
  computational methods including Variational Inference (VI), Expectation
  Propagation (EP), and MCMC — including scalability, convergence, and
  approximate inference more broadly;
  model families such as latent variable models, generalized linear mixed
  models (GLMM), dynamic and state-space models, and statistical models for
  network data;
  applied and methodological work grounded in principled statistical reasoning,
  with preference for work that advances both theory and computation.
  I am moderately interested in nonparametric Bayes, survival analysis, and
  spatial statistics when they connect to the above themes.
  I am less interested in pure deep learning, reinforcement learning, graph neural networks and similar, as well as purely
  algorithmic or computer-science-focused papers without statistical content,
  and applied papers that use standard methods without methodological
  contribution. I am also less interested in papers that simply describe R packages, unless strongly tailored to the above interests.

