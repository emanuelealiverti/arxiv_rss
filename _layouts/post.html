---
layout: default
---

<div class="post-nav">
  <a class="back-link" href="{{ '/' | relative_url }}">&larr; back</a>
  <button class="unmark-btn" id="unmark-btn">don't mark as read</button>
</div>

<article>
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta-block">
      <span class="badge badge-{{ page.badge }}">{{ page.badge }}</span>
      {{ page.author }}
      <span class="sep">&middot;</span>
      {{ page.tags | join: ', ' }}
      <span class="sep">&middot;</span>
      {{ page.date | date: "%-d %b %Y" }}
    </div>
  </div>

  {%- if page.summary and page.summary != '' -%}
  <div class="summary-box">{{ page.summary }}</div>
  {%- endif -%}

  <h3>Abstract</h3>
  {{ content }}
</article>

<script>
(function () {
  var key = 'read:' + window.location.pathname;
  localStorage.setItem(key, '1');
  var btn = document.getElementById('unmark-btn');
  btn.onclick = function () {
    localStorage.removeItem(key);
    btn.textContent = 'kept unread';
    btn.disabled = true;
  };
})();
</script>
