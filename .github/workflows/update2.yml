name: Deploy Jekyll Website

on:
  schedule:
    - cron: "45 6 * * 1-5"  # 6:45 UTC = 8:45 Rome (CEST/Europe/Rome, summer); becomes 7:45 in winter (CET)

  workflow_dispatch:

jobs:
  update_content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4  #  Cambia branch
        with:
          ref: main  # change branch if on another
          persist-credentials: true # E lascialo per tutto

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: update rss # Aggiorna sito con python
        run: |
          python -m pip install -r requirements.txt
          python rss_arxiv.py
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Commit updated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git diff --staged --quiet || git commit -m "Update posts $(date +%Y-%m-%d)"
          git push

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems

      - name: Build Jekyll site 
        run: bundle exec jekyll build  

      - name: Deploy to GitHub Pages  # Deploy tramite secret creato da impostazioni generali
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.JK_TOKEN }}
          publish_dir: ./_site 

