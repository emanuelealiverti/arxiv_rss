  <h1>On the maximum of Cramer's V</h1>
  <br>Etsuo Hamada</h3>
  <br> [stat.ME]

  <p>The Cramer’s V is popular as an association coefficient in goodness-of-fit tests for contingency tables and its maximum value is known to be $1$, but it is not true. We propose a modified Cramer’s V.</p>
